<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="965" viewBox="0 0 1140 965" role="img" aria-labelledby="title desc">
<title id="title">재고 확보와 결제 처리 시퀀스</title>
<desc id="desc">재고 임시 확보를 커밋하고, 결제 작업과 고정 작업 키를 저장한 뒤 PG를 호출한다. 결제 결과와 Outbox를 함께 저장해 이벤트를 전달한다. 예약 서비스는 상태 전이 시점에 유효한 임시 확보를 확정한다.</desc>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#252525}path,line,rect,ellipse,polygon{stroke-linejoin:round}</style>
