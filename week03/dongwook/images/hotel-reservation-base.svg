<title id="title">일반적인 호텔 예약 시스템</title>
<desc id="desc">사용자와 관리자가 API Gateway에 접근한다. 호텔·요금 서비스는 DB와 Redis를 사용한다. 예약 서비스는 예약·재고 DB를, 결제 서비스는 결제 DB와 PG를 사용한다. 두 DB의 Outbox에서 메시지 큐로 이벤트를 전달한다.</desc>
