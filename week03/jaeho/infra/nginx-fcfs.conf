# WEB 서버 (fcfs-web): 정적 화면 + WAS 리버스 프록시 + 관리 콘솔(인증 없음 — 요청에 따라 해제)
upstream fcfs_was {
    server __WAS_IP__:8080;
    keepalive 512;
}

server {
    listen 80 default_server;
    listen 8080 default_server;          # ALB 대상 그룹 포트
    server_name _;
    access_log off;                      # 부하 테스트 중 디스크 I/O 방지

    root /var/www/fcfs;
    location = /health { return 200 "ok"; }
    location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }

    location /api/ {
        proxy_pass http://fcfs_was;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_next_upstream off;         # 접수 요청은 재전송하면 안 됨(중복 접수)
    }
    # /api/stats 캐시는 WAS 안에서 0.4초 (nginx 캐시는 초 단위라 0.5초 갱신에 못 씀)

    location /admin { proxy_pass http://127.0.0.1:9000; }
    location /ctl/  { proxy_pass http://127.0.0.1:9000; proxy_read_timeout 30s; }
}
