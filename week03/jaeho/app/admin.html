<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>티케팅 POC 관리</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#16202a;--mute:#7a8591;--line:#e6eaef;--in:#6d5cff;--q:#f29d0b;--ok:#14a46c;--bad:#e04848;--tk:#139fdc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0;flex:1;min-width:160px}header nav{display:flex;gap:6px}header nav a{padding:7px 16px;border-radius:99px;font-size:13.5px;font-weight:700;color:var(--mute);text-decoration:none}header nav a.on{background:var(--ink);color:#fff}
.badge{padding:4px 12px;border-radius:99px;font-size:12.5px;font-weight:700;background:#eef1f4;color:var(--mute)}
.b-load{background:#efeaff;color:var(--in)}.b-drain{background:#fff3dd;color:#b26f00}.b-done{background:#e3f6ee;color:var(--ok)}.b-stopped,.b-error{background:#fde9e9;color:var(--bad)}
main{max-width:1200px;margin:0 auto;padding:20px 16px;display:grid;grid-template-columns:300px 1fr;gap:18px}
@media(max-width:920px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
h2{font-size:13px;color:var(--mute);margin:0 0 12px;font-weight:700}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px}
input[type=text],input[type=number]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
details{margin-top:10px;font-size:13px}summary{cursor:pointer;color:var(--mute)}
.calc{margin:12px 0 0;font-size:12.5px;color:var(--mute)}.calc b{color:var(--ink)}
.go{width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-size:15px;font-weight:800;cursor:pointer}
.go.stop{background:#fff;color:var(--bad);border:1.5px solid var(--bad)}.go:disabled{opacity:.4;cursor:default}
.err{color:var(--bad);font-size:12.5px;margin-top:8px}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;align-items:center;gap:6px}
@media(max-width:920px){.flow{grid-template-columns:1fr 1fr}.flow .arr{display:none}}
.st{padding:14px;border-radius:12px;background:#f8f9fb}.st small{display:block;font-size:12px;color:var(--mute);font-weight:600}
.st b{display:block;font-size:30px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}.st span{font-size:12px;color:var(--mute)}
.arr{color:#c3cad2;font-size:20px}
#chart{width:100%;height:190px;display:block;margin-top:14px}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}.leg i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.brk{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{padding:5px 11px;border-radius:99px;font-size:12.5px;border:1px solid var(--line);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
#parts{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.pc{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mute);min-width:0}
.pc .up{height:78px;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border-bottom:1px solid var(--line)}
.pc .up span{font-weight:700;color:#b26f00;font-size:12px;font-variant-numeric:tabular-nums}
.pc .up i,.pc .dn i{display:block;width:62%;transition:height .4s ease-out}
.pc .up i{background:var(--q);border-radius:3px 3px 0 0}.pc .dn{height:56px;width:100%;display:flex;flex-direction:column;align-items:center}
.pc .dn i{background:#cfd6de;border-radius:0 0 3px 3px}.pc .dn span{font-variant-numeric:tabular-nums}
.pc b{color:var(--ink);font-size:12px;margin-top:4px;display:flex;align-items:center;gap:4px}
.res{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.verdict{font-size:22px;font-weight:800}.nums{display:flex;gap:22px;flex-wrap:wrap}.nums div small{display:block;font-size:12px;color:var(--mute)}.nums div b{font-size:22px}
.checks{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.checks span{font-size:12px;padding:3px 9px;border-radius:99px;background:#e3f6ee;color:var(--ok)}.checks span.x{background:#fde9e9;color:var(--bad)}
.meta{font-size:12px;color:var(--mute);margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:right}td:nth-child(-n+2),th:nth-child(-n+2){text-align:left}th{color:var(--mute);font-weight:600}
</style></head><body>
<header><h1 id="title">🎫 티켓팅 POC</h1><span class="badge" id="phase">대기</span><nav><a href="/">참여자</a><a href="/admin" class="on">관리자</a></nav></header>
<main>
<aside>
 <div class="card">
  <h2>티켓 오픈 설정</h2>
  <label for="name">이벤트 이름</label><input id="name" type="text" maxlength="100" value="콘서트 티켓 오픈">
  <div class="two">
   <div><label for="users">참여자 (명)</label><input id="users" type="number" min="1" max="200000" value="30000"></div>
   <div><label for="tickets">티켓 (장)</label><input id="tickets" type="number" min="1" max="1000000" value="3000"></div>
   <div style="grid-column:1/-1"><label for="ramp">몰리는 시간 (초)</label><input id="ramp" type="number" min="1" max="600" value="15"></div>
  </div>
  <div class="calc" id="calc"></div>
  <button class="go" id="run">▶ 티켓 오픈</button>
  <div class="err" id="err"></div>
 </div>
 <div class="card"><h2>구성</h2><div style="font-size:12.5px;line-height:1.9;color:var(--mute)">
  가상 사용자 → ALB → <b style="color:var(--ink)">WEB</b> → <b style="color:var(--ink)">WAS</b> → <b style="color:var(--q)">Kafka</b> → <b style="color:var(--ink)">Worker</b> → <b style="color:var(--ink)">DB</b></div></div>
</aside>
<section>
 <div class="card">
  <div class="flow">
   <div class="st"><small>① 몰려오는 요청</small><b id="f-in" style="color:var(--in)">-</b><span>요청/초</span></div><div class="arr">→</div>
   <div class="st"><small>② 큐에서 대기</small><b id="f-q" style="color:var(--q)">-</b><span>Kafka 대기 건수</span></div><div class="arr">→</div>
   <div class="st"><small>③ DB 처리</small><b id="f-db" style="color:var(--ok)">-</b><span>건/초</span></div><div class="arr">→</div>
   <div class="st"><small>④ 남은 티켓</small><b id="f-tk" style="color:var(--tk)">-</b><span id="f-tk2">-</span></div>
  </div>
  <svg id="chart"></svg>
  <div class="leg"><span><i style="background:var(--in)"></i>몰려오는 요청/초</span><span><i style="background:var(--ok)"></i>DB 처리/초</span><span><i style="background:var(--q)"></i>큐 대기 (오른쪽 축)</span></div>
 </div>
 <div class="card">
  <h2 id="ktitle">Kafka — 파티션별 큐</h2>
  <div class="brk" id="brokers"></div>
  <div id="parts"></div>
  <div class="leg"><span><i style="background:var(--q)"></i>지금 대기</span><span><i style="background:#cfd6de"></i>이번 회차 누적 유입</span><span>막대 아래 점 = 리더 브로커</span></div>
 </div>
 <div class="card">
  <h2>결과</h2><div id="result" style="color:var(--mute)">티켓 오픈을 누르면 여기에 결과가 나옵니다.</div>
  <details><summary>실행 이력</summary><table><thead><tr><th>#</th><th>이벤트</th><th>참여자</th><th>티켓</th><th>DB 한도</th><th>RPS</th><th>p99</th><th>실패</th><th>판정</th></tr></thead><tbody id="hist"></tbody></table></details>
 </div>
</section>
</main>
<script>
const $=id=>document.getElementById(id),fmt=n=>n==null||isNaN(n)||n<0?'-':Math.round(n).toLocaleString();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BC=['#139fdc','#6d5cff','#14a46c'];
const ease=k=>1-Math.pow(1-k,3);
// 숫자: 이전 값 → 새 값을 0.4초 동안 굴려서 표시
function tween(el,to){if(to==null||isNaN(to)||to<0){cancelAnimationFrame(el._raf);el.textContent='-';el._v=null;return}
 const from=el._v??to;el._v=to;if(from===to){el.textContent=fmt(to);return}const t0=performance.now();cancelAnimationFrame(el._raf);
 const step=now=>{const k=Math.min(1,(now-t0)/400);el.textContent=fmt(from+(to-from)*ease(k));if(k<1)el._raf=requestAnimationFrame(step)};el._raf=requestAnimationFrame(step)}
// 그래프: 새 점이 오른쪽에서 미끄러져 들어오고, 축 최댓값도 0.4초 동안 천천히 바뀜
let cprev=null,craf=0;
function drawChart(tl){const W=800,H=190,S=[tl.map(x=>Math.max(0,x.lag)),tl.map(x=>x.rps),tl.map(x=>x.doneRate)];
 const m1=Math.max(1,...S[1],...S[2]),m2=Math.max(1,...S[0]),last=S.map(a=>a.length?a[a.length-1]:0);
 const p=cprev&&cprev.n<=tl.length&&cprev.id===drawChart.id?cprev:{n:tl.length,m1,m2,last};cprev={n:tl.length,m1,m2,last,id:drawChart.id};
 $('chart').setAttribute('viewBox',`0 0 ${W} ${H}`);$('chart').setAttribute('preserveAspectRatio','none');
 const t0=performance.now();cancelAnimationFrame(craf);
 const frame=now=>{const e=ease(Math.min(1,(now-t0)/400)),n=p.n+(tl.length-p.n)*e,M=[p.m2+(m2-p.m2)*e,p.m1+(m1-p.m1)*e,p.m1+(m1-p.m1)*e];
  const pts=li=>S[li].map((v,i)=>{if(i===S[li].length-1&&tl.length>p.n)v=p.last[li]+(v-p.last[li])*e;return[(i/Math.max(1,n-1))*W,H-(v/M[li])*(H-16)]});
  const pl=(li,col)=>{const q=pts(li);return q.length?`<polyline fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" points="${q.map(x=>x.join(',')).join(' ')}"/>`:''};
  const qa=pts(0);$('chart').innerHTML=(qa.length?`<polygon fill="#f29d0b" fill-opacity=".15" points="0,${H} ${qa.map(x=>x.join(',')).join(' ')} ${qa[qa.length-1][0]},${H}"/>`:'')+pl(0,'#f29d0b')+pl(1,'#6d5cff')+pl(2,'#14a46c')+
   `<text x="4" y="12" font-size="11" fill="#7a8591">${fmt(M[1])}/s</text><text x="${W-4}" y="12" font-size="11" text-anchor="end" fill="#b26f00">대기 ${fmt(M[0])}</text>`;
  if(e<1)craf=requestAnimationFrame(frame)};craf=requestAnimationFrame(frame)}
function calc(){const u=+$('users').value,r=Math.max(1,+$('ramp').value),t=Math.max(1,+$('tickets').value);
 $('calc').innerHTML=`초당 <b>${fmt(Math.ceil(u/r))}명</b> 유입 · 경쟁률 <b>${(u/t).toFixed(0)}:1</b> · DB는 초당 500건 처리`}
['users','ramp','tickets'].forEach(i=>$(i).oninput=calc);calc();
let busy=false;
$('run').onclick=async()=>{$('err').textContent='';
 if(busy){await fetch('/ctl/stop',{method:'POST'});return}
 const body={name:$('name').value,users:+$('users').value,tickets:+$('tickets').value,rampSec:+$('ramp').value,workerRate:500,dupPct:0,poll:true};
 const r=await fetch('/ctl/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)$('err').textContent=await r.text();state()};
const PH={load:'부하 중',drain:'큐 처리 중',done:'완료',stopped:'중지됨',error:'오류'};
async function state(){let s;try{s=await(await fetch('/ctl/state')).json()}catch(e){return}
 const c=s.current;busy=!!c&&(c.phase==='load'||c.phase==='drain');
 $('run').textContent=busy?'■ 중지':'▶ 티켓 오픈';$('run').className='go'+(busy?' stop':'');$('run').disabled=busy&&c.phase!=='load';
 if(c){const tl=c.timeline||[],L=tl[tl.length-1]||{},sm=c.summary||{};
  $('title').textContent=`🎫 ${c.config.name}`;$('phase').textContent=PH[c.phase]||c.phase;$('phase').className='badge b-'+c.phase;
  tween($('f-in'),busy?L.rps:0);tween($('f-q'),L.lag);tween($('f-db'),busy?L.doneRate:0);
  tween($('f-tk'),L.stock);$('f-tk2').textContent=`/ ${fmt(c.config.tickets)}장`;
  if(drawChart.id!==c.id||drawChart.len!==tl.length){drawChart.id=c.id;drawChart.len=tl.length;drawChart(tl)}
  if(c.checks){const r=(c.final||{}).results||{};
   $('result').innerHTML=`<div class="res"><div class="verdict" style="color:${c.pass?'var(--ok)':'var(--bad)'}">${c.pass?'✔ 정합성 통과':'✘ 검증 실패'}</div>
    <div class="nums"><div><small>당첨</small><b>${fmt(r.SUCCESS||0)}</b></div><div><small>매진</small><b>${fmt((sm.soldout||0)+(r.SOLD_OUT||0))}</b></div><div><small>중복 차단</small><b>${fmt(r.DUPLICATE||0)}</b></div><div><small>실패</small><b style="color:${sm.failed?'var(--bad)':'inherit'}">${fmt(sm.failed)}</b></div><div><small>응답 p99</small><b>${fmt(sm.submitP99)}<span style="font-size:13px"> ms</span></b></div></div></div>
    <div class="checks">${c.checks.map(x=>`<span class="${x.ok?'':'x'}" title="${esc(x.info)}">${x.ok?'✔':'✘'} ${esc(x.name)}</span>`).join('')}</div>
    <div class="meta">평균 ${fmt(sm.rps)} RPS · 요청 ${fmt(sm.requests)}건 · 큐 최대 대기 ${fmt(Math.max(...tl.map(x=>x.lag)))}건${sm.droppedIterations?` · 부하 발생기가 못 만든 사용자 ${fmt(sm.droppedIterations)}명`:''}</div>`}
  else $('result').textContent=busy?(c.phase==='drain'?'요청은 끝났고, 큐에 남은 주문을 DB가 처리하는 중…':'티켓 오픈 진행 중…'):(c.error||'')}
 $('hist').innerHTML=(s.history||[]).map(h=>{const m=h.summary||{};return`<tr><td>${h.id}</td><td>${esc(h.config.name)}</td><td>${fmt(h.config.users)}</td><td>${fmt(h.config.tickets)}</td><td>${h.config.workerRate?fmt(h.config.workerRate):'무제한'}</td><td>${fmt(m.rps)}</td><td>${fmt(m.submitP99)}</td><td>${fmt(m.failed)}</td><td>${h.phase==='done'?(h.pass?'✔':'✘'):PH[h.phase]}</td></tr>`}).join('')}
async function kafka(){let s;try{s=await(await fetch('/api/stats')).json()}catch(e){return}
 const k=s.kafka;if(!k||!k.partitions)return;const P=k.partitions.filter(Boolean),B=[...k.brokers].sort((a,b)=>a.id-b.id),bi={};B.forEach((b,i)=>bi[b.id]=i);
 $('ktitle').textContent=`Kafka — 파티션 ${P.length}개 · 브로커 ${B.length}대 · 복제 ${P[0]?P[0].replicas:'-'}벌`;
 $('brokers').innerHTML=B.map((b,i)=>{const bad=P.some(p=>p.isr<p.replicas&&p.leader===b.id);return`<span class="chip"><span class="dot" style="background:${BC[i%3]}"></span><b>Broker-${i+1}</b> 리더 ${b.leaders}개 <span style="color:${bad?'var(--bad)':'var(--ok)'}">${bad?'● 복제 지연':'● 정상'}</span></span>`}).join('')+
  `<span class="chip" style="color:var(--mute)">워커 ${[...new Set(P.map(p=>p.worker).filter(Boolean))].length}대</span>`;
 const mq=Math.max(5,...P.map(p=>Math.max(0,p.lag))),mi=Math.max(1,...P.map(p=>Math.max(0,p.in))),box=$('parts');
 if(box.children.length!==P.length)box.innerHTML=P.map(p=>`<div class="pc"><div class="up"><span>&nbsp;</span><i style="height:0"></i></div><div class="dn"><i style="height:0"></i><span>0</span></div><b><span class="dot"></span>P${p.p}</b></div>`).join('');
 P.forEach((p,i)=>{const el=box.children[i],lq=Math.max(0,p.lag),up=el.querySelector('.up'),dn=el.querySelector('.dn');
  up.querySelector('i').style.height=(lq?Math.max(3,lq/mq*58):0)+'px';const ls=up.querySelector('span');if(lq)tween(ls,lq);else{cancelAnimationFrame(ls._raf);ls._v=0;ls.innerHTML='&nbsp;'}
  dn.querySelector('i').style.height=(Math.max(0,p.in)/mi*38)+'px';tween(dn.querySelector('span'),Math.max(0,p.in));
  el.querySelector('.dot').style.background=BC[(bi[p.leader]??0)%3]})}
setInterval(state,500);state();setInterval(kafka,500);kafka();
</script></body></html>
