name: Study dashboard

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, closed, labeled, unlabeled, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions: {}

concurrency:
  group: study-dashboard-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Use only the trusted base branch. PR PDFs are read through the API.
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PDF tools
        run: python -m pip install pypdf==6.10.0
      - name: Verify dashboard rules
        run: python -m unittest discover -s dashboard -v
      - name: Reuse unchanged PDF summaries
        uses: actions/cache@v4
        with:
          path: .dashboard-cache
          key: study-pdf-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: study-pdf-v1-
      - name: Generate review pages
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: main
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python dashboard/build.py _site/index.html --cache-dir .dashboard-cache
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
